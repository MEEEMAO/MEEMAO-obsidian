<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>退休金模型互動試算器</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f4;
      --panel: #ffffff;
      --text: #232323;
      --muted: #667085;
      --line: #d8d5ca;
      --accent: #2563eb;
      --accent-2: #0f766e;
      --accent-3: #b45309;
      --danger: #be123c;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171717;
        --panel: #222222;
        --text: #f4f4f5;
        --muted: #a1a1aa;
        --line: #3f3f46;
        --accent: #60a5fa;
        --accent-2: #2dd4bf;
        --accent-3: #f59e0b;
        --danger: #fb7185;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    main {
      max-width: 1040px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    .math {
      display: inline-block;
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      font-style: italic;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .math sub {
      font-size: 0.72em;
      line-height: 0;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(260px, 360px) 1fr;
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }

    .controls {
      display: grid;
      gap: 14px;
    }

    .control-row {
      display: grid;
      gap: 7px;
    }

    label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      font-weight: 650;
    }

    label > span:last-child {
      color: var(--muted);
      font-weight: 500;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .metric {
      min-height: 112px;
      display: grid;
      align-content: space-between;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
    }

    .metric small {
      color: var(--muted);
      font-size: 12px;
    }

    .metric strong {
      font-size: clamp(20px, 3vw, 30px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .bar-list {
      display: grid;
      gap: 12px;
    }

    .bar-row {
      display: grid;
      gap: 6px;
    }

    .bar-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      align-items: baseline;
    }

    .bar-name {
      min-width: 0;
    }

    .bar-head strong {
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .bar-track {
      width: 100%;
      height: 14px;
      overflow: hidden;
      border-radius: 999px;
      background: color-mix(in srgb, var(--line), transparent 35%);
    }

    .bar {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      transition: width 180ms ease;
    }

    .b0 { background: var(--muted); }
    .bn { background: var(--accent-2); }
    .bi { background: var(--accent-3); }
    .b4 { background: var(--accent); }

    .note {
      margin-top: 14px;
      padding: 12px;
      border-left: 4px solid var(--accent);
      background: color-mix(in srgb, var(--accent), transparent 88%);
      border-radius: 6px;
      font-size: 14px;
      color: var(--text);
    }

    .note .math {
      font-size: 1.04em;
    }

    @media (max-width: 760px) {
      main {
        padding: 14px;
      }

      .layout,
      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>退休金模型互動試算器</h1>
      <p>用每月支出、退休後收入、實質年化報酬率 <span class="math">r<sub>a</sub></span> 與退休年數，比較三種資產目標。</p>
    </header>

    <section class="layout" aria-label="退休金模型試算">
      <div class="panel controls">
        <div class="control-row">
          <label for="monthlyExpense">
            <span>每月生活費</span>
            <span id="monthlyExpenseLabel"></span>
          </label>
          <input id="monthlyExpense" type="range" min="20000" max="150000" step="5000" value="50000">
        </div>

        <div class="control-row">
          <label for="monthlyIncome">
            <span>退休後月收入</span>
            <span id="monthlyIncomeLabel"></span>
          </label>
          <input id="monthlyIncome" type="range" min="0" max="100000" step="5000" value="0">
        </div>

        <div class="control-row">
          <label for="realReturn">
            <span>實質年化報酬率 <span class="math">r<sub>a</sub></span></span>
            <span id="realReturnLabel"></span>
          </label>
          <input id="realReturn" type="range" min="0" max="8" step="0.25" value="3">
        </div>

        <div class="control-row">
          <label for="years">
            <span>退休支撐年數 N</span>
            <span id="yearsLabel"></span>
          </label>
          <input id="years" type="range" min="10" max="60" step="1" value="30">
        </div>

        <div class="control-row">
          <label for="withdrawRate">
            <span>提領率</span>
            <span id="withdrawRateLabel"></span>
          </label>
          <input id="withdrawRate" type="range" min="2.5" max="6" step="0.25" value="4">
        </div>
      </div>

      <div>
        <div class="cards">
          <div class="metric">
            <small>年提領額 <span class="math">W</span></small>
            <strong id="annualGap"></strong>
            <small>每年需要由投資資產支付</small>
          </div>
          <div class="metric">
            <small>4% / 提領率模型</small>
            <strong id="withdrawWealth"></strong>
            <small id="withdrawMultiple"></small>
          </div>
        </div>

        <div class="panel">
          <div class="bar-list" id="bars"></div>
          <div class="note" id="modelNote"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const controls = {
      monthlyExpense: document.getElementById("monthlyExpense"),
      monthlyIncome: document.getElementById("monthlyIncome"),
      realReturn: document.getElementById("realReturn"),
      years: document.getElementById("years"),
      withdrawRate: document.getElementById("withdrawRate")
    };

    const labels = {
      monthlyExpense: document.getElementById("monthlyExpenseLabel"),
      monthlyIncome: document.getElementById("monthlyIncomeLabel"),
      realReturn: document.getElementById("realReturnLabel"),
      years: document.getElementById("yearsLabel"),
      withdrawRate: document.getElementById("withdrawRateLabel")
    };

    const annualGap = document.getElementById("annualGap");
    const withdrawWealth = document.getElementById("withdrawWealth");
    const withdrawMultiple = document.getElementById("withdrawMultiple");
    const bars = document.getElementById("bars");
    const modelNote = document.getElementById("modelNote");

    const money = new Intl.NumberFormat("zh-TW", {
      style: "currency",
      currency: "TWD",
      maximumFractionDigits: 0
    });

    function shortMoney(value) {
      if (!Number.isFinite(value)) return "無限大";
      if (value >= 100000000) return `${(value / 100000000).toFixed(2)} 億`;
      return `${(value / 10000).toFixed(0)} 萬`;
    }

    function finiteAnnuity(annualGapValue, realReturnValue, yearsValue) {
      if (annualGapValue <= 0) return 0;
      if (realReturnValue === 0) return annualGapValue * yearsValue;
      return annualGapValue * (1 - Math.pow(1 + realReturnValue, -yearsValue)) / realReturnValue;
    }

    function render() {
      const monthlyExpense = Number(controls.monthlyExpense.value);
      const monthlyIncome = Number(controls.monthlyIncome.value);
      const realReturnPct = Number(controls.realReturn.value);
      const years = Number(controls.years.value);
      const withdrawRatePct = Number(controls.withdrawRate.value);
      const gap = Math.max((monthlyExpense - monthlyIncome) * 12, 0);
      const realReturn = realReturnPct / 100;
      const withdrawRate = withdrawRatePct / 100;

      const w0 = gap * years;
      const wn = finiteAnnuity(gap, realReturn, years);
      const winf = realReturn === 0 ? Infinity : gap / realReturn;
      const w4 = withdrawRate === 0 ? Infinity : gap / withdrawRate;

      labels.monthlyExpense.textContent = money.format(monthlyExpense);
      labels.monthlyIncome.textContent = money.format(monthlyIncome);
      labels.realReturn.textContent = `${realReturnPct.toFixed(2)}%`;
      labels.years.textContent = `${years} 年`;
      labels.withdrawRate.textContent = `${withdrawRatePct.toFixed(2)}%`;

      annualGap.textContent = shortMoney(gap);
      withdrawWealth.textContent = shortMoney(w4);
      withdrawMultiple.textContent = `${(1 / withdrawRate).toFixed(1)} 倍年支出`;

      const values = [
        {
          nameHtml: '<span class="math">W<sub>0</sub></span>：無報酬，直接準備全部支出',
          value: w0,
          className: "b0"
        },
        {
          nameHtml: '<span class="math">W<sub>N</sub>(r<sub>a</sub>)</span>：有限年金，可逐步動本金',
          value: wn,
          className: "bn"
        },
        {
          nameHtml: '<span class="math">W<sub>&infin;</sub>(r<sub>a</sub>)</span>：只靠報酬，不動本金',
          value: winf,
          className: "bi"
        },
        {
          nameHtml: '<span class="math">W<sub>4%</sub></span>：用提領率快速估算',
          value: w4,
          className: "b4"
        }
      ];

      const finiteValues = values.map(item => item.value).filter(Number.isFinite);
      const maxValue = Math.max(...finiteValues, 1);

      bars.innerHTML = values.map(item => {
        const width = Number.isFinite(item.value) ? Math.max(item.value / maxValue * 100, 2) : 100;
        return `
          <div class="bar-row">
            <div class="bar-head">
              <span class="bar-name">${item.nameHtml}</span>
              <strong>${shortMoney(item.value)}</strong>
            </div>
            <div class="bar-track" aria-hidden="true">
              <div class="bar ${item.className}" style="width: ${width}%"></div>
            </div>
          </div>
        `;
      }).join("");

      if (gap === 0) {
        modelNote.textContent = "退休後收入已覆蓋生活費，投資資產不需要負擔固定生活支出。";
      } else if (realReturn === 0) {
        modelNote.innerHTML = '當 <span class="math">r<sub>a</sub></span> 為 0% 時，資產不會自行增長；有限年金模型會退化成 <span class="math">W<sub>0</sub></span>，而永續領息模型沒有有限解。';
      } else {
        modelNote.innerHTML = `在 <span class="math">r<sub>a</sub></span> = ${realReturnPct.toFixed(2)}%、N = ${years} 年時，允許動用本金的 <span class="math">W<sub>N</sub>(r<sub>a</sub>)</span> 需要 ${shortMoney(wn)}；若想完全不動本金，<span class="math">W<sub>&infin;</sub>(r<sub>a</sub>)</span> 需要 ${shortMoney(winf)}。`;
      }
    }

    Object.values(controls).forEach(control => control.addEventListener("input", render));
    render();
  </script>
</body>
</html>
