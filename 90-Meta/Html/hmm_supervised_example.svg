<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="920" height="600" font-family="Helvetica, 'PingFang TC', 'Noto Sans TC', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6cb0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="600" fill="#ffffff"/>

  <text x="40" y="44" font-size="21" font-weight="600" fill="#1a202c">HMM 參數 λ = (π, A, B)：天氣（隱藏）→ 活動（觀測）</text>
  <text x="40" y="70" font-size="14" fill="#718096">參數值由「已標註狀態」的語料直接數次數估計（情況 1：Supervised MLE）</text>

  <!-- pi arrows -->
  <line x1="230" y1="112" x2="230" y2="158" stroke="#2b6cb0" stroke-width="2.2" marker-end="url(#ahb)"/>
  <line x1="640" y1="112" x2="640" y2="158" stroke="#2b6cb0" stroke-width="2.2" marker-end="url(#ahb)"/>
  <text x="230" y="102" font-size="15" fill="#2b6cb0" text-anchor="middle" font-weight="600">π(晴) = 0.6</text>
  <text x="640" y="102" font-size="15" fill="#2b6cb0" text-anchor="middle" font-weight="600">π(雨) = 0.4</text>
  <text x="435" y="102" font-size="13" fill="#2b6cb0" text-anchor="middle">← π：序列第一天的狀態分布 →</text>

  <!-- transition arcs -->
  <path d="M 285 187 C 380 137, 490 137, 585 187" fill="none" stroke="#4a5568" stroke-width="2.2" marker-end="url(#ah)"/>
  <text x="435" y="147" font-size="15" fill="#2d3748" text-anchor="middle">a(晴→雨) = 0.3</text>

  <path d="M 585 242 C 490 292, 380 292, 285 242" fill="none" stroke="#4a5568" stroke-width="2.2" marker-end="url(#ah)"/>
  <text x="435" y="309" font-size="15" fill="#2d3748" text-anchor="middle">a(雨→晴) = 0.4</text>

  <!-- self loops -->
  <path d="M 183 182 C 95 150, 95 265, 183 233" fill="none" stroke="#4a5568" stroke-width="2.2" marker-end="url(#ah)"/>
  <text x="96" y="213" font-size="15" fill="#2d3748" text-anchor="middle">0.7</text>
  <path d="M 693 182 C 781 150, 781 265, 693 233" fill="none" stroke="#4a5568" stroke-width="2.2" marker-end="url(#ah)"/>
  <text x="790" y="213" font-size="15" fill="#2d3748" text-anchor="middle">0.6</text>

  <!-- states -->
  <circle cx="230" cy="208" r="56" fill="#fefcbf" stroke="#d69e2e" stroke-width="2.5"/>
  <text x="230" y="203" font-size="26" fill="#744210" text-anchor="middle" font-weight="600">晴</text>
  <text x="230" y="226" font-size="12" fill="#975a16" text-anchor="middle">S₁</text>

  <circle cx="640" cy="208" r="56" fill="#e2e8f0" stroke="#4a5568" stroke-width="2.5"/>
  <text x="640" y="203" font-size="26" fill="#2d3748" text-anchor="middle" font-weight="600">雨</text>
  <text x="640" y="226" font-size="12" fill="#4a5568" text-anchor="middle">S₂</text>

  <text x="435" y="200" font-size="13" fill="#718096" text-anchor="middle">A：狀態轉移</text>
  <text x="435" y="219" font-size="12" fill="#a0aec0" text-anchor="middle">每個狀態射出的機率和 = 1</text>

  <!-- dashed emission links -->
  <line x1="230" y1="264" x2="230" y2="352" stroke="#a0aec0" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="640" y1="264" x2="640" y2="352" stroke="#a0aec0" stroke-width="1.6" stroke-dasharray="5 4"/>

  <text x="40" y="360" font-size="14" fill="#718096">B：發射機率 b_j(k) = P(觀測 | 狀態)</text>

  <!-- emission panel: 晴 -->
  <rect x="86" y="372" width="288" height="176" rx="10" fill="#fffff0" stroke="#ecc94b" stroke-width="1.5"/>
  <text x="230" y="395" font-size="14" fill="#975a16" text-anchor="middle">b_晴( · )　和 = 1</text>
  <g fill="#d69e2e">
    <rect x="124" y="442" width="48" height="72" rx="3"/>
    <rect x="206" y="478" width="48" height="36" rx="3"/>
    <rect x="288" y="502" width="48" height="12" rx="3"/>
  </g>
  <g font-size="13" fill="#744210" text-anchor="middle">
    <text x="148" y="434">0.6</text><text x="230" y="470">0.3</text><text x="312" y="494">0.1</text>
  </g>
  <line x1="110" y1="514" x2="350" y2="514" stroke="#d69e2e" stroke-width="1.5"/>
  <g font-size="13" fill="#744210" text-anchor="middle">
    <text x="148" y="533">散步</text><text x="230" y="533">購物</text><text x="312" y="533">打掃</text>
  </g>

  <!-- emission panel: 雨 -->
  <rect x="496" y="372" width="288" height="176" rx="10" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5"/>
  <text x="640" y="395" font-size="14" fill="#4a5568" text-anchor="middle">b_雨( · )　和 = 1</text>
  <g fill="#718096">
    <rect x="534" y="502" width="48" height="12" rx="3"/>
    <rect x="616" y="466" width="48" height="48" rx="3"/>
    <rect x="698" y="454" width="48" height="60" rx="3"/>
  </g>
  <g font-size="13" fill="#2d3748" text-anchor="middle">
    <text x="558" y="494">0.1</text><text x="640" y="458">0.4</text><text x="722" y="446">0.5</text>
  </g>
  <line x1="520" y1="514" x2="760" y2="514" stroke="#718096" stroke-width="1.5"/>
  <g font-size="13" fill="#2d3748" text-anchor="middle">
    <text x="558" y="533">散步</text><text x="640" y="533">購物</text><text x="722" y="533">打掃</text>
  </g>

  <text x="435" y="578" font-size="12" fill="#a0aec0" text-anchor="middle">N = 2 個隱藏狀態，M = 3 種觀測符號　→　π: 2 個數、A: 2×2、B: 2×3</text>
</svg>
